# SPDX-License-Identifier: MIT
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.caching=true

# The add-on.
mod_version=0.1.0-alpha.7
maven_group=thaumictinkerer
archives_name=ThaumicTinkerer

# The platform: the same versions as the Thaumcraft 4 Reload build (gradle.properties there).
minecraft_version=1.21.1
fabric_loader_version=0.16.14
fabric_api_version=0.116.17+1.21.1
architectury_api_version=13.0.11
neoforge_version=21.1.259

# Optional integrations (compiled against their APIs, never bundled or required): the versions Thaumcraft 4 Reload compiles against.
emi_version=1.1.22+1.21.1
jei_version=19.43.0.398
jade_version=15.10.6
# CC: Tweaked (ComputerCraft): the peripherals and the turtle upgrade of compat/src/main/java/thaumic/tinkerer/compat/computer compile
# against its API artifacts only (cc-tweaked-1.21.1-fabric-api / -forge-api); the full mod is on the GameTest runtimes of both loaders
# (and with -PwithComputerCraft on the development clients). 1.116.1 (2025-07-12) is the newest release whose Fabric jars this build's Loom
# (Architectury Loom 1.11) remaps: 1.116.2 and later were built with Fabric Loom 1.12 to 1.17, which Loom 1.11 refuses ("Mod was built with a
# newer version of Loom"). The API the add-on uses is the same in 1.120.2 (checked source by source).
cc_tweaked_version=1.116.1

# Thaumcraft 4 Reload, for both loaders (Thaumcraft-fabric for the root project, Thaumcraft-neoforge for :neoforge), installed into ~/.m2 by
# `./gradlew :fabric:publishToMavenLocal :neoforge:publishToMavenLocal` in a checkout of https://github.com/acak1221/Thaumcraft-1.21.1
# (tools/publish-thaumcraft.sh and the CI build exactly the commit thaumcraft_ref).
# The add-on needs extensions of thaumcraft.api that are on main of that repository since 4c38e3f, and the golem and machine API
# (thaumcraft.api.golems, thaumcraft.api.machines: the Golem Connector's golem data and the CC: Tweaked peripherals of the Thaumcraft
# machines) since 316897d, so an older Thaumcraft does not compile it. thaumcraft_ref is a commit (not the branch, which moves; c1d8024
# is 316897d merged with the research book's compound pages); move thaumcraft_ref and thaumcraft_version (mod_version of that commit)
# together.
thaumcraft_version=0.1.0-alpha.7
thaumcraft_ref=c1d802406fa7ff885d0b14fa6cd5c6039a1cfd04
