# SPDX-License-Identifier: MIT
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.caching=true

# The add-on.
mod_version=0.1.0-alpha.7
maven_group=thaumictinkerer
archives_name=ThaumicTinkerer

# The platform: the same versions as the Thaumcraft 4 Reload build (gradle.properties there).
minecraft_version=1.21.1
fabric_loader_version=0.16.14
fabric_api_version=0.116.17+1.21.1
architectury_api_version=13.0.11
neoforge_version=21.1.259

# Optional integrations (compiled against their APIs, never bundled or required): the versions Thaumcraft 4 Reload compiles against.
emi_version=1.1.22+1.21.1
jei_version=19.43.0.398
jade_version=15.10.6
# Team Reborn Energy, the Fabric energy API (MIT; maven.fabricmc.net, mod id team_reborn_energy): optional, compiled against, never bundled
# or required; on the GameTest run only (fabric.gradle). 4.1.0 (2024-06-02) is the release for Minecraft 1.21 to 1.21.4 (its fabric.mod.json:
# minecraft >=1.21-, fabric-transfer-api-v1 >=5.1.0); 4.2.0 needs 1.21.5.
team_reborn_energy_version=4.1.0

# Thaumcraft 4 Reload, for both loaders (Thaumcraft-fabric for the root project, Thaumcraft-neoforge for :neoforge), installed into ~/.m2 by
# `./gradlew :fabric:publishToMavenLocal :neoforge:publishToMavenLocal` in a checkout of https://github.com/acak1221/Thaumcraft-1.21.1
# (tools/publish-thaumcraft.sh and the CI build exactly the commit thaumcraft_ref).
# The add-on needs extensions of thaumcraft.api that are on main of that repository since 4c38e3f, so an older Thaumcraft does not compile
# it. thaumcraft_ref is a commit (not the branch, which moves) of main; move thaumcraft_ref and thaumcraft_version (mod_version of that
# commit) together. 10739c4 is main of 2026-11-01 (0.1.0-alpha.11): its research book draws an add-on's compound page (the Levitational
# Locomotive's diagram, TileBlocks.md 2.3) with the renderer of Thaumcraft's own construct pages; older commits skip that page.
thaumcraft_version=0.1.0-alpha.11
thaumcraft_ref=10739c471e78abae4223570d72043c07882b6d10
# Open Parties and Claims for the claim scenes of the multiplayer check only (fabric.gradle, neoforge/build.gradle; Modrinth Maven, both
# published 2026-10-17), and Forge Config API Port, which OPAC requires on Fabric (published 2025-11-12). Never in the add-on's jars.
opac_fabric_version=fabric-1.21.1-0.33.0
opac_neoforge_version=neoforge-1.21.1-0.33.0
forge_config_api_port_version=v21.1.6-1.21.1-Fabric
# The version of night-config that Forge Config API Port 21.1.6 carries inside its jar (META-INF/jars/core-3.8.0.jar, toml-3.8.0.jar).
night_config_version=3.8.0
