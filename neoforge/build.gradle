// SPDX-License-Identifier: MIT
// Thaumic Tinkerer for NeoForge (Minecraft 1.21.1): the NeoForge build of the add-on, a subproject next to the Fabric root project.
// MIT (LICENSE-MIT, NOTICE.md); the add-on sources it compiles are CC BY-NC-SA 3.0 (LICENSE).
//
// It compiles the same loader-neutral tree as the Fabric build (common/src/main and the optional integrations in compat/src/main) together
// with the NeoForge glue of neoforge/src/main: the @Mod entry, the posters of the loader events (docs/HOOKS.md), the item renderer backend and
// the client hooks. Thaumcraft 4 Reload comes as thaumcraft:Thaumcraft-neoforge:<thaumcraft_version> from the local Maven repository, like the
// Fabric jar (tools/publish-thaumcraft.sh installs both).
plugins {
 id 'dev.architectury.loom'
}

group = rootProject.maven_group
version = rootProject.mod_version
base { archivesName = rootProject.archives_name + '-neoforge' }

repositories {
 exclusiveContent {
  forRepository { mavenLocal() }
  filter { includeGroup 'thaumcraft' }
 }
 mavenCentral()
 maven { url = 'https://maven.neoforged.net/releases/' }
 maven { url = 'https://maven.architectury.dev/' }
 maven { url = 'https://maven.terraformersmc.com/releases/'; content { includeGroup 'dev.emi' } }
 maven { url = 'https://maven.blamejared.com/'; content { includeGroup 'mezz.jei' } }
 maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}

dependencies {
 minecraft "com.mojang:minecraft:$rootProject.minecraft_version"
 mappings loom.officialMojangMappings()
 neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
 modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"
 modImplementation "thaumcraft:Thaumcraft-neoforge:$rootProject.thaumcraft_version"

 // The optional integrations, compile-only as on Fabric; `-PwithEmi`, `-PwithJei`, `-PwithJade` add them to the development runs.
 modCompileOnly "dev.emi:emi-neoforge:$rootProject.emi_version:api"
 modCompileOnly "mezz.jei:jei-1.21.1-neoforge-api:$rootProject.jei_version"
 modCompileOnly "maven.modrinth:jade:$rootProject.jade_version+neoforge"
 if (providers.gradleProperty('withEmi').isPresent()) modLocalRuntime "dev.emi:emi-neoforge:$rootProject.emi_version"
 if (providers.gradleProperty('withJei').isPresent()) modLocalRuntime "mezz.jei:jei-1.21.1-neoforge:$rootProject.jei_version"
 if (providers.gradleProperty('withJade').isPresent()) modLocalRuntime "maven.modrinth:jade:$rootProject.jade_version+neoforge"
}

sourceSets {
 main {
  java.srcDirs = [rootProject.file('common/src/main/java'), file('src/main/java'), rootProject.file('compat/src/main/java')]
  resources.srcDirs = [rootProject.file('common/src/main/resources'), file('src/main/resources')]
 }
}

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }

processResources {
 inputs.property 'version', project.version
 filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
 // The licence travels with every artifact of the add-on.
 from(rootProject.file('LICENSE')) { into 'META-INF' }
}

loom.runs {
 client {
  client()
  name 'Thaumic Tinkerer NeoForge client'
  runDir 'run-client'
 }
 server {
  server()
  name 'Thaumic Tinkerer NeoForge server'
  runDir 'run-server'
 }
}

// ---------------------------------------------------------------------------------------------------------------------------------
// GameTests on NeoForge (docs/NEOFORGE.md, "GameTests on NeoForge"): the shared checks of common/src/gameTest run on a NeoForge
// dedicated GameTest server, wrapped by neoforge/src/gameTest (the test mod thaumictinkerer_gametest; its wrappers are generated from the
// Fabric ones by tools/neoforge_gametests.py). The counterpart of the source set thaumicTinkererGameTest and the run tinkererGameTest of
// fabric.gradle.
//
//   ./gradlew :neoforge:runGameTest                                   every test; the report is neoforge/build/tinkerer-gametest-results.xml
//   ./gradlew :neoforge:runGameTest -PtinkererGameTestFilter=a,b,x*   only the named tests (the syntax of the Fabric run)
sourceSets {
 gameTest {
  java.srcDirs = [rootProject.file('common/src/gameTest/java'), file('src/gameTest/java')]
  // common/...: the parity oracle (tt_oracle/*.json); neoforge/...: the test mod (neoforge.mods.toml, mixins, the empty structures, the
  // flat world preset with the Bedrock dimension)
  resources.srcDirs = [rootProject.file('common/src/gameTest/resources'), file('src/gameTest/resources')]
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
 }
}

def tinkererGameTestFilter = providers.gradleProperty('tinkererGameTestFilter').getOrElse('')
def tinkererGameTestReport = layout.buildDirectory.file('tinkerer-gametest-results.xml').get().asFile
def tinkererGameTestRunDir = file('run-gametest')

loom.runs {
 // Server-side runtime assertions of the add-on on NeoForge. The GameTests of Thaumcraft are not part of its jar and not loaded.
 gameTest {
  server()
  name 'Thaumic Tinkerer NeoForge GameTests'
  // The same fixed heap as the Fabric run: the suite generates real chunks and must not depend on the size of the machine.
  vmArg '-Xmx3G'
  source sourceSets.gameTest
  // Two mods, like the two classpath groups of the Fabric run: the add-on (main) and the harness (gameTest).
  mods {
   thaumictinkerer { sourceSet sourceSets.main }
   thaumictinkerer_gametest { sourceSet sourceSets.gameTest }
  }
  vmArg '-Dneoforge.enableGameTest=true'
  vmArg '-Dneoforge.gameTestServer=true'
  // The wrappers name the templates thaumictinkerer:<class>.empty, so their namespace is the add-on's.
  vmArg '-Dneoforge.enabledGameTestNamespaces=thaumictinkerer'
  vmArg "-Dthaumictinkerer.gameTestReportFile=${tinkererGameTestReport.absolutePath}"
  if (!tinkererGameTestFilter.isBlank()) vmArg "-Dthaumictinkerer.gameTestFilter=${tinkererGameTestFilter}"
  runDir 'run-gametest'
 }
}
// As on Fabric, `check` compiles the GameTest source set (the root project's `./gradlew check` runs this project's `check` too).
tasks.named('check') { dependsOn tasks.named('gameTestClasses') }
tasks.named('runGameTest') {
 dependsOn tasks.named('gameTestClasses')
 // Every run starts on a new world (and without the report of the last run), so that no result depends on what an earlier run left.
 doFirst {
  delete new File(tinkererGameTestRunDir, 'world')
  delete tinkererGameTestReport
 }
 // The server exits with the number of failed tests; but its Main catches a failure to start (an unknown name in the filter, a mod that
 // fails to load), logs it and exits with 0. Only the report tells a run that tested from one that never started.
 doLast {
  def log = new File(tinkererGameTestRunDir, 'logs/latest.log')
  if (!tinkererGameTestReport.isFile()) {
   throw new GradleException("The NeoForge GameTest server wrote no report (${tinkererGameTestReport}): it did not run the tests; see ${log}")
  }
  def cases = (tinkererGameTestReport.getText('UTF-8') =~ /<testcase\b/).count
  if (cases == 0) throw new GradleException("The NeoForge GameTest report ${tinkererGameTestReport} has no test; see ${log}")
  logger.lifecycle("Thaumic Tinkerer NeoForge GameTests: ${cases} tests, report ${tinkererGameTestReport}")
 }
}
