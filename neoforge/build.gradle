// SPDX-License-Identifier: MIT
// Thaumic Tinkerer for NeoForge (Minecraft 1.21.1): the NeoForge build of the add-on, a subproject next to the Fabric root project.
// MIT (LICENSE-MIT, NOTICE.md); the add-on sources it compiles are CC BY-NC-SA 3.0 (LICENSE).
//
// It compiles the same loader-neutral tree as the Fabric build (common/src/main and the optional integrations in compat/src/main) together
// with the NeoForge glue of neoforge/src/main: the @Mod entry, the posters of the loader events (docs/HOOKS.md), the item renderer backend and
// the client hooks. Thaumcraft 4 Reload comes as thaumcraft:Thaumcraft-neoforge:<thaumcraft_version> from the local Maven repository, like the
// Fabric jar (tools/publish-thaumcraft.sh installs both).
plugins {
 id 'dev.architectury.loom'
}

group = rootProject.maven_group
version = rootProject.mod_version
base { archivesName = rootProject.archives_name + '-neoforge' }

repositories {
 exclusiveContent {
  forRepository { mavenLocal() }
  filter { includeGroup 'thaumcraft' }
 }
 mavenCentral()
 maven { url = 'https://maven.neoforged.net/releases/' }
 maven { url = 'https://maven.architectury.dev/' }
 maven { url = 'https://maven.terraformersmc.com/releases/'; content { includeGroup 'dev.emi' } }
 maven { url = 'https://maven.blamejared.com/'; content { includeGroup 'mezz.jei' } }
 maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
 maven { url = 'https://maven.squiddev.cc'; content { includeGroup 'cc.tweaked' } }
}

dependencies {
 minecraft "com.mojang:minecraft:$rootProject.minecraft_version"
 mappings loom.officialMojangMappings()
 neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
 modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"
 modImplementation "thaumcraft:Thaumcraft-neoforge:$rootProject.thaumcraft_version"

 // The optional integrations, compile-only as on Fabric; `-PwithEmi`, `-PwithJei`, `-PwithJade` add them to the development runs.
 modCompileOnly "dev.emi:emi-neoforge:$rootProject.emi_version:api"
 modCompileOnly "mezz.jei:jei-1.21.1-neoforge-api:$rootProject.jei_version"
 modCompileOnly "maven.modrinth:jade:$rootProject.jade_version+neoforge"
 if (providers.gradleProperty('withEmi').isPresent()) modLocalRuntime "dev.emi:emi-neoforge:$rootProject.emi_version"
 if (providers.gradleProperty('withJei').isPresent()) modLocalRuntime "mezz.jei:jei-1.21.1-neoforge:$rootProject.jei_version"
 if (providers.gradleProperty('withJade').isPresent()) modLocalRuntime "maven.modrinth:jade:$rootProject.jade_version+neoforge"
 // CC: Tweaked: compile-only API, as on Fabric (its NeoForge artifacts are still called "forge"); the mod itself is on the GameTest
 // runtime only (configuration modGameTestRuntimeOnly below), `-PwithComputerCraft` adds it to the development clients too.
 modCompileOnly "cc.tweaked:cc-tweaked-1.21.1-forge-api:$rootProject.cc_tweaked_version"
 if (providers.gradleProperty('withComputerCraft').isPresent()) modLocalRuntime "cc.tweaked:cc-tweaked-1.21.1-forge:$rootProject.cc_tweaked_version"
}

sourceSets {
 main {
  java.srcDirs = [rootProject.file('common/src/main/java'), file('src/main/java'), rootProject.file('compat/src/main/java')]
  resources.srcDirs = [rootProject.file('common/src/main/resources'), file('src/main/resources')]
 }
}

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }

processResources {
 inputs.property 'version', project.version
 filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
 // The licence travels with every artifact of the add-on.
 from(rootProject.file('LICENSE')) { into 'META-INF' }
}

loom.runs {
 client {
  client()
  name 'Thaumic Tinkerer NeoForge client'
  runDir 'run-client'
 }
 server {
  server()
  name 'Thaumic Tinkerer NeoForge server'
  runDir 'run-server'
 }
}

// ---------------------------------------------------------------------------------------------------------------------------------
// GameTests on NeoForge (docs/NEOFORGE.md, "GameTests on NeoForge"): the shared checks of common/src/gameTest run on a NeoForge
// dedicated GameTest server, wrapped by neoforge/src/gameTest (the test mod thaumictinkerer_gametest; its wrappers are generated from the
// Fabric ones by tools/neoforge_gametests.py). The counterpart of the source set thaumicTinkererGameTest and the run tinkererGameTest of
// fabric.gradle.
//
//   ./gradlew :neoforge:runGameTest                                   every test; the report is neoforge/build/tinkerer-gametest-results.xml
//   ./gradlew :neoforge:runGameTest -PtinkererGameTestFilter=a,b,x*   only the named tests (the syntax of the Fabric run)
sourceSets {
 gameTest {
  java.srcDirs = [rootProject.file('common/src/gameTest/java'), file('src/gameTest/java')]
  // common/...: the parity oracle (tt_oracle/*.json); neoforge/...: the test mod (neoforge.mods.toml, mixins, the empty structures, the
  // flat world preset with the Bedrock dimension)
  resources.srcDirs = [rootProject.file('common/src/gameTest/resources'), file('src/gameTest/resources')]
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
 }
}
// CC: Tweaked on the GameTest server only, as on Fabric (fabric.gradle): the peripherals and the turtle upgrade are checked with the real mod.
loom.createRemapConfigurations(sourceSets.gameTest)
dependencies {
 modGameTestRuntimeOnly "cc.tweaked:cc-tweaked-1.21.1-forge:$rootProject.cc_tweaked_version"
}

def tinkererGameTestFilter = providers.gradleProperty('tinkererGameTestFilter').getOrElse('')
def tinkererGameTestReport = layout.buildDirectory.file('tinkerer-gametest-results.xml').get().asFile
def tinkererGameTestRunDir = file('run-gametest')

loom.runs {
 // Server-side runtime assertions of the add-on on NeoForge. The GameTests of Thaumcraft are not part of its jar and not loaded.
 gameTest {
  server()
  name 'Thaumic Tinkerer NeoForge GameTests'
  // The same fixed heap as the Fabric run: the suite generates real chunks and must not depend on the size of the machine.
  vmArg '-Xmx3G'
  source sourceSets.gameTest
  // Two mods, like the two classpath groups of the Fabric run: the add-on (main) and the harness (gameTest).
  mods {
   thaumictinkerer { sourceSet sourceSets.main }
   thaumictinkerer_gametest { sourceSet sourceSets.gameTest }
  }
  vmArg '-Dneoforge.enableGameTest=true'
  vmArg '-Dneoforge.gameTestServer=true'
  // The wrappers name the templates thaumictinkerer:<class>.empty, so their namespace is the add-on's.
  vmArg '-Dneoforge.enabledGameTestNamespaces=thaumictinkerer'
  vmArg "-Dthaumictinkerer.gameTestReportFile=${tinkererGameTestReport.absolutePath}"
  if (!tinkererGameTestFilter.isBlank()) vmArg "-Dthaumictinkerer.gameTestFilter=${tinkererGameTestFilter}"
  runDir 'run-gametest'
 }
}
// As on Fabric, `check` compiles the GameTest source set (the root project's `./gradlew check` runs this project's `check` too).
tasks.named('check') { dependsOn tasks.named('gameTestClasses') }
tasks.named('runGameTest') {
 dependsOn tasks.named('gameTestClasses')
 // Every run starts on a new world (and without the report of the last run), so that no result depends on what an earlier run left.
 doFirst {
  delete new File(tinkererGameTestRunDir, 'world')
  delete tinkererGameTestReport
 }
 // The server exits with the number of failed tests; but its Main catches a failure to start (an unknown name in the filter, a mod that
 // fails to load), logs it and exits with 0. Only the report tells a run that tested from one that never started.
 doLast {
  def log = new File(tinkererGameTestRunDir, 'logs/latest.log')
  if (!tinkererGameTestReport.isFile()) {
   throw new GradleException("The NeoForge GameTest server wrote no report (${tinkererGameTestReport}): it did not run the tests; see ${log}")
  }
  def cases = (tinkererGameTestReport.getText('UTF-8') =~ /<testcase\b/).count
  if (cases == 0) throw new GradleException("The NeoForge GameTest report ${tinkererGameTestReport} has no test; see ${log}")
  logger.lifecycle("Thaumic Tinkerer NeoForge GameTests: ${cases} tests, report ${tinkererGameTestReport}")
 }
}

// ---------------------------------------------------------------------------------------------------------------------------------
// The client smoke on NeoForge (docs/CLIENT_VERIFICATION.md, docs/NEOFORGE.md "Client smoke on NeoForge"): the loader-neutral harness of
// common/src/clientSmoke (package thaumic.tinkerer.clientsmoke, shared with the Fabric run) and its NeoForge side, neoforge/src/clientSmoke
// (the client-only test mod thaumictinkerer_clientsmoke: its neoforge.mods.toml, the @Mod entry and NeoForgeSmokePlatform), in a real client
// with a 1280x720 window. The counterpart of the source set thaumicTinkererClientSmoke and the run tinkererClientSmoke of fabric.gradle.
// Compiled by check; loaded only by runClientSmoke; no jar task includes its output. Started by tools/client-smoke.sh under Xvfb:
//
//   tools/client-smoke.sh --neoforge                              the whole run; results in neoforge/build/tinkerer-client-smoke
//   tools/client-smoke.sh --neoforge -- -PwithEmi -PwithJade      with EMI and Jade in the client (-PwithJei separately)
sourceSets {
 clientSmoke {
  java.srcDirs = [rootProject.file('common/src/clientSmoke/java'), file('src/clientSmoke/java')]
  resources.srcDirs = [file('src/clientSmoke/resources')]
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
 }
}

def tinkererClientSmokeOut = layout.buildDirectory.dir('tinkerer-client-smoke').get().asFile
def tinkererClientSmokeRunDir = file('run-clientsmoke')
// The harness stops itself after this many seconds with a partial report and a non-zero exit (the watchdog); the script's -t.
def tinkererClientSmokeTimeout = providers.gradleProperty('tinkererClientSmokeTimeout').getOrElse('1500')

loom.runs {
 clientSmoke {
  client()
  name 'Thaumic Tinkerer NeoForge client smoke'
  vmArg '-Xmx3G'
  source sourceSets.clientSmoke
  // Two mods, like the two classpath groups of the Fabric run: the add-on (main) and the harness (clientSmoke).
  mods {
   thaumictinkerer { sourceSet sourceSets.main }
   thaumictinkerer_clientsmoke { sourceSet sourceSets.clientSmoke }
  }
  vmArg '-Dthaumictinkerer.clientSmoke=true'
  vmArg "-Dthaumictinkerer.clientSmoke.outDir=${tinkererClientSmokeOut.absolutePath}"
  vmArg "-Dthaumictinkerer.clientSmoke.sourceRoot=${rootProject.projectDir.absolutePath}"
  vmArg "-Dthaumictinkerer.clientSmoke.timeoutSeconds=${tinkererClientSmokeTimeout}"
  programArgs '--width', '1280', '--height', '720'
  // Git-ignored (run-*/); the results go to neoforge/build/tinkerer-client-smoke.
  runDir 'run-clientsmoke'
 }
}
tasks.named('check') { dependsOn tasks.named('clientSmokeClasses') }

// The owned run directory of the client smoke, as on Fabric (prepareTinkererClientSmoke): fixed options (English, GUI scale 2, no sound,
// small view distance), a clean output directory. The singleplayer world is made by the harness itself and is deleted first.
tasks.register('prepareClientSmoke') {
 group = 'verification'
 description = 'Resets neoforge/run-clientsmoke/options.txt and the result directory of the Thaumic Tinkerer client smoke on NeoForge.'
 doLast {
  tinkererClientSmokeRunDir.mkdirs()
  new File(tinkererClientSmokeRunDir, 'options.txt').setText('onboardAccessibility:false\nlang:en_us\nguiScale:2\npauseOnLostFocus:false\n' +
    'renderDistance:8\nsimulationDistance:6\nmaxFps:60\nenableVsync:false\ntutorialStep:none\nnarrator:0\n' +
    'soundCategory_master:0.0\nskipMultiplayerWarning:true\nhideBundleTutorial:true\n', 'UTF-8')
  delete new File(tinkererClientSmokeRunDir, 'saves')
  delete tinkererClientSmokeOut
  tinkererClientSmokeOut.mkdirs()
 }
}
tasks.named('runClientSmoke') {
 dependsOn tasks.named('clientSmokeClasses'), tasks.named('prepareClientSmoke')
 // The exit code says whether the harness itself completed; what the checks found is in report.json, not here.
 doLast {
  def report = new File(tinkererClientSmokeOut, 'report.json')
  if (!report.isFile()) throw new GradleException("The NeoForge client smoke wrote no report: ${report}")
  def status = new groovy.json.JsonSlurper().parse(report, 'UTF-8').harness?.status
  if (status != 'COMPLETED') throw new GradleException("The NeoForge client smoke harness did not complete (status ${status}); see ${report}")
  logger.lifecycle("Thaumic Tinkerer NeoForge client smoke: harness completed, results in ${report}")
 }
}

// ---------------------------------------------------------------------------------------------------------------------------------
// The multiplayer check on NeoForge (docs/MULTIPLAYER_VERIFICATION.md): the counterpart of runTinkererMultiplayer of fabric.gradle. A real
// dedicated server with the add-on and the server test mod thaumictinkerer_mpserver (common/src/multiplayerServer and its NeoForge entry
// in neoforge/src/multiplayerServer; the source set multiplayerServer below, compiled by check, loaded only by the mpServer run, in no
// jar), and real clients, the client smoke harness above in its multiplayer mode, all started and stopped by ONE task,
// runMultiplayer (gradle/multiplayer.gradle; the runs are only its description of each JVM). Started by tools/multiplayer-smoke.sh:
//
//   tools/multiplayer-smoke.sh --neoforge          results in neoforge/build/tinkerer-multiplayer
sourceSets {
 multiplayerServer {
  java.srcDirs = [rootProject.file('common/src/multiplayerServer/java'), file('src/multiplayerServer/java')]
  resources.srcDirs = [file('src/multiplayerServer/resources')]
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
 }
}
tasks.named('check') { dependsOn tasks.named('multiplayerServerClasses') }

def tinkererMpOut = layout.buildDirectory.dir('tinkerer-multiplayer').get().asFile
def tinkererMpPort = providers.gradleProperty('tinkererMultiplayerPort').getOrElse('25592')
// The watchdog of the lead and the second client, in seconds; the server's is an hour longer.
def tinkererMpTimeout = providers.gradleProperty('tinkererMultiplayerTimeout').getOrElse('1200')
def tinkererMpPlayers = [lead: 'TTAlpha', peer: 'TTBravo', mismatch: 'TTMismatch', 'mismatch-kami': 'TTMismatchKami', 'kami-on': 'TTKamiOn']
def tinkererMpClient = { settings, String role ->
 settings.client()
 settings.name "Thaumic Tinkerer NeoForge multiplayer check: ${role} client"
 // Two clients run at the same time next to the server and the Gradle daemon: 2 GB of heap each.
 settings.vmArg '-Xmx2G'
 settings.source sourceSets.clientSmoke
 settings.mods {
  thaumictinkerer { sourceSet sourceSets.main }
  thaumictinkerer_clientsmoke { sourceSet sourceSets.clientSmoke }
 }
 settings.vmArg '-Dthaumictinkerer.clientSmoke=true'
 settings.vmArg "-Dthaumictinkerer.clientSmoke.mode=multiplayer-${role}"
 settings.vmArg "-Dthaumictinkerer.clientSmoke.outDir=${new File(tinkererMpOut, role).absolutePath}"
 settings.vmArg "-Dthaumictinkerer.clientSmoke.sourceRoot=${rootProject.projectDir.absolutePath}"
 settings.vmArg "-Dthaumictinkerer.clientSmoke.timeoutSeconds=${role in ['lead', 'peer'] ? tinkererMpTimeout : 600}"
 settings.programArgs '--username', tinkererMpPlayers[role], '--quickPlayMultiplayer', "127.0.0.1:${tinkererMpPort}".toString(), '--width', '1280', '--height', '720'
 settings.runDir "run-mp-${role}"
}
loom.runs {
 mpServer {
  server()
  name 'Thaumic Tinkerer NeoForge multiplayer check: dedicated server'
  vmArg '-Xmx2G'
  source sourceSets.multiplayerServer
  mods {
   thaumictinkerer { sourceSet sourceSets.main }
   thaumictinkerer_mpserver { sourceSet sourceSets.multiplayerServer }
  }
  vmArg '-Dthaumictinkerer.mpServer=true'
  vmArg "-Dthaumictinkerer.mpServer.outDir=${tinkererMpOut.absolutePath}"
  vmArg "-Dthaumictinkerer.mpServer.timeoutSeconds=${(tinkererMpTimeout as int) + 3600}"
  programArgs '--nogui'
  runDir 'run-mp-server'
 }
 mpLead { tinkererMpClient(delegate, 'lead') }
 mpPeer { tinkererMpClient(delegate, 'peer') }
 mpMismatch { tinkererMpClient(delegate, 'mismatch') }
 mpMismatchKami { tinkererMpClient(delegate, 'mismatch-kami') }
 mpKamiOn { tinkererMpClient(delegate, 'kami-on') }
}
apply from: rootProject.file('gradle/multiplayer.gradle')
registerTinkererMultiplayer(task: 'runMultiplayer', loader: 'neoforge', outDir: tinkererMpOut, port: tinkererMpPort, timeout: tinkererMpTimeout,
  runs: [server: 'runMpServer', lead: 'runMpLead', peer: 'runMpPeer', mismatch: 'runMpMismatch',
         'mismatch-kami': 'runMpMismatchKami', 'kami-on': 'runMpKamiOn'],
  dirs: [server: file('run-mp-server'), lead: file('run-mp-lead'), peer: file('run-mp-peer'), mismatch: file('run-mp-mismatch'),
         'mismatch-kami': file('run-mp-mismatch-kami'),
         'kami-on': file('run-mp-kami-on')])
